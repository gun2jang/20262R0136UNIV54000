<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino Runner</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main>
    <h1>Dino Runner</h1>
    <p class="score">현재 점수 <strong id="score">0</strong> <span class="best-score">최고점수 <strong id="best-score">0</strong></span></p>
    <canvas id="game" width="900" height="260" tabindex="0" aria-label="공룡 러너 게임. Space, 위쪽 화살표 또는 게임 화면 클릭으로 시작하고 점프합니다. 아래쪽 화살표를 누르고 있으면 숙입니다.">
      이 게임은 Canvas를 지원하는 브라우저에서 실행할 수 있습니다.
    </canvas>
    <button id="start-button" type="button">시작</button>
    <p class="instructions">Space / ↑ / 게임 화면 클릭: 시작·점프 · ↓ 누르기: 숙이기<br>선인장은 뛰어넘고 날아오는 새는 숙여 피하세요. 시간이 지날수록 이동과 점수 증가가 빨라집니다.<br>게임 오버 후 같은 조작이나 재시작 버튼으로 다시 시작합니다.</p>
  </main>
</body>
</html>
