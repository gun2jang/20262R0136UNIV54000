<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino Runner</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main>
    <h1>Dino Runner</h1>
    <p class="score">현재 점수 <strong id="score">0</strong> <span class="best-score">최고점수 <strong id="best-score">0</strong></span></p>
    <p id="mode" aria-live="polite">공룡 구간 · 다음 익룡 변신 300점</p>
    <canvas id="game" width="900" height="260" tabindex="0" aria-label="공룡 러너 게임. Space, 위쪽 화살표 또는 클릭으로 시작하고 점프합니다. 아래쪽 화살표로 숙입니다. 익룡 구간에서는 위아래 화살표로 비행합니다.">
      이 게임은 Canvas를 지원하는 브라우저에서 실행할 수 있습니다.
    </canvas>
    <button id="start-button" type="button">시작</button>
    <p class="instructions">공룡: Space / ↑ / 클릭으로 점프 · ↓ 누르기로 숙이기<br>선인장 1~3개는 뛰어넘고 새는 숙여 피하세요. 익룡: ↑ ↓를 눌러 높이를 조절하며 새 피하기<br>300~399점, 600~699점… 익룡으로 변신! 게임 오버 후 Space / ↑ / 클릭으로 재시작합니다.</p>
  </main>
</body>
</html>
